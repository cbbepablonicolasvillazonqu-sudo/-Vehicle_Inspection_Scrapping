; Límites de subida para fotos de vehículos (fotos de cámara de celular).
; Local (php artisan serve) usa php.ini; en hosting con PHP-FPM/LiteSpeed/Apache
; (p. ej. Hostinger) este archivo aplica los mismos valores. Debe permitir al
; menos la regla de la app: 10 MB por foto, hasta 10 fotos por envío.
upload_max_filesize = 12M
post_max_size = 64M
memory_limit = 256M
