; Límites de subida para fotos de vehículos (fotos de cámara de celular).
; Local (php artisan serve) usa php.ini; en hosting con PHP-FPM/LiteSpeed/Apache
; (p. ej. Hostinger) este archivo aplica los mismos valores.
;
; Regla de la app: 5 fotos por envío, 10 MB cada una (GestorGastos::rules()).
; Livewire admite hasta 12 MB por archivo en su validación temporal, así que el
; peor caso real es 5 x 12 = 60 MB, por debajo de post_max_size.
upload_max_filesize = 12M
post_max_size = 64M
memory_limit = 256M

; Subir 60 MB desde datos móviles supera con facilidad los 60 s por defecto de
; max_input_time: el POST se corta a medias y el usuario no recibe ningún aviso.
max_input_time = 300
max_execution_time = 120
